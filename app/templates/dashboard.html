{% extends 'base.html' %}{% block content %}<section class="dashboard"><div class="dash-head"><div><p class="eyebrow">YOUR PLANNING SPACE</p><h1 id="hello">Dashboard</h1></div><button class="btn ghost" id="logout">Logout</button></div><div class="tabs"><button class="tab active" data-tab="home">🏠 Home</button><button class="tab" data-tab="party">🎉 Party</button><button class="tab" data-tab="jewelry">💎 Jewelry</button><button class="tab" data-tab="history">🕘 History</button></div><div id="home" class="planner active"><form data-endpoint="/api/generate-home"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Rooms<input name="rooms" placeholder="Living Room, Bedroom" required></label><label>Style<select name="style"><option>modern</option><option>minimal</option><option>traditional</option><option>boho</option></select></label><label>Notes<textarea name="notes"></textarea></label><button class="btn">Generate home plan</button></form></div><div id="party" class="planner"><form data-endpoint="/api/generate-party"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Event<select name="event_type"><option>birthday</option><option>wedding</option><option>corporate</option><option>anniversary</option></select></label><label>Venue<input name="venue" value="home"></label><label>City<input name="city"></label><label>Notes<textarea name="notes"></textarea></label><button class="btn">Generate party plan</button></form></div><div id="jewelry" class="planner"><form id="jewelryForm" enctype="multipart/form-data" data-endpoint="/api/generate-jewelry"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" value="special occasion"></label><label>Style<select name="style"><option>classic</option><option>minimal</option><option>traditional</option><option>statement</option></select></label><label>Outfit image (optional)<input name="outfit" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Notes<textarea name="notes"></textarea></label><button class="btn">Generate jewelry plan</button></form></div><div id="history" class="planner"><div id="historyList"></div></div><section id="results" class="results"></section></section>{% endblock %}{% block scripts %}<script src="/static/js/dashboard.js"></script>{% endblock %}
