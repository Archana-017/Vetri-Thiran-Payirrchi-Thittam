{% extends 'base.html' %}{% block content %}<section class="auth"><div class="panel"><h1>Welcome back</h1><p>Sign in to save and review your plans.</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Login</button><p id="message"></p></form><p>New here? <a href="/register">Create an account</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth/login','POST',Object.fromEntries(new FormData(e.target)));if(r.access_token)location='/dashboard';else document.getElementById('message').textContent=r.detail||'Login failed';}</script>{% endblock %}
