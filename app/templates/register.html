{% extends 'base.html' %}{% block content %}<section class="auth"><div class="panel"><h1>Create account</h1><p>Your recommendations and history stay linked to your account.</p><form id="registerForm"><label>Name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="btn">Register</button><p id="message"></p></form><p>Already registered? <a href="/login">Login</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth/register','POST',Object.fromEntries(new FormData(e.target)));if(r.access_token)location='/dashboard';else document.getElementById('message').textContent=r.detail||'Registration failed';}</script>{% endblock %}
